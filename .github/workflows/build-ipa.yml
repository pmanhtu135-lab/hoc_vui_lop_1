name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor & Add iOS (SPM)
        run: |
          mkdir -p www
          if [ ! -f www/index.html ] && [ -f index.html ]; then
            cp index.html www/index.html
          fi
          if [ ! -f www/index.html ]; then
            echo "<h1>Hoc Vui Lop 1</h1>" > www/index.html
          fi
          rm -rf ios
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap add ios --packagemanager SPM
          npx cap sync ios

      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $PWD/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          APP_PATH=$(find $PWD/DerivedData -name "App.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r HocVuiLop1.ipa Payload

      - name: Upload HocVuiLop1.ipa
        uses: actions/upload-artifact@v4
        with:
          name: HocVuiLop1-IPA
          path: ios/App/HocVuiLop1.ipa
