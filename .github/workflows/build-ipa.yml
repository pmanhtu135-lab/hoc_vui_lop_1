   name: Build iOS IPA
   on:
     workflow_dispatch:
     push:
       branches: [ main ]

   jobs:
     build-ipa:
       runs-on: macos-latest
       steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
             node-version: '20'

         - name: Install Capacitor & Add iOS
           run: |
             npm install
             npx cap add ios
             npx cap sync ios

         - name: Build Unsigned IPA
           run: |
             cd ios/App
             xcodebuild -project App.xcodeproj \
               -scheme App \
               -configuration Release \
               -sdk iphoneos \
               -archivePath $PWD/build/App.xcarchive \
               archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
             mkdir -p Payload
             cp -r $PWD/build/App.xcarchive/Products/Applications/App.app Payload/
             zip -r HocVuiLop1.ipa Payload

         - name: Upload HocVuiLop1.ipa
           uses: actions/upload-artifact@v4
           with:
             name: HocVuiLop1-IPA
             path: ios/App/HocVuiLop1.ipa
